<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marathon Training</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23256abf'/><path d='M8 21l5-9 4 6 3-4 4 7' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root {
    color-scheme: light;
    --bg:        #f4f3ef;
    --surface:   #fcfcfb;
    --surface-2: #f0efec;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #77766f;
    --line:      #e4e2dc;
    --accent:    #256abf;
    --accent-ink:#ffffff;
    --series-actual:  #2a78d6;
    --series-planned: #a8a69f;
    --c-run:      #2a78d6;
    --c-bike:     #eb6834;
    --c-strength: #1baf7a;
    --c-row:      #4a3aa7;
    --c-race:     #e34948;
    --c-rest:     #a8a69f;
    --good:    #008300;
    --bad:     #c93a39;
    --shadow: 0 1px 2px rgba(20,20,10,.05), 0 4px 16px rgba(20,20,10,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg:        #111110;
      --surface:   #1a1a19;
      --surface-2: #232321;
      --ink:       #f4f3ee;
      --ink-2:     #c3c2b7;
      --muted:     #8f8e86;
      --line:      #2f2f2c;
      --series-actual:  #3987e5;
      --series-planned: #6b6a64;
      --c-run:      #3987e5;
      --c-bike:     #d95926;
      --c-strength: #199e70;
      --c-row:      #9085e9;
      --c-race:     #e66767;
      --c-rest:     #6b6a64;
      --good:    #3fb950;
      --bad:     #e66767;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }
  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 20px 0 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .brand svg { width: 28px; height: 28px; }
  nav.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--surface-2); padding: 4px; border-radius: 12px; }
  nav.tabs a {
    padding: 7px 16px; border-radius: 9px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14px;
  }
  nav.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  nav.tabs a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .card-pad { padding: 20px; }
  .section { margin-top: 20px; }
  .section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .section-head h2 { font-size: 16px; letter-spacing: -.005em; }
  .section-head .sub { color: var(--muted); font-size: 13px; }
  .section-head .spacer { flex: 1; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
    padding: 7px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;
  }
  a.btn { color: inherit; text-decoration: none; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary, a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn.ghost:hover { background: var(--surface-2); }

  /* ---------- Stat tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { padding: 16px 18px; }
  .tile .label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .tile .value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; line-height: 1.1; }
  .tile .value small { font-size: 15px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
  .tile .note { color: var(--ink-2); font-size: 13px; margin-top: 4px; }

  /* ---------- Chips / pills ---------- */
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2);
          background: var(--surface-2); padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-rest); display: inline-block; }
  .chip[data-cat="Run"] i { background: var(--c-run); }
  .chip[data-cat="Bike"] i { background: var(--c-bike); }
  .chip[data-cat="Strength"] i { background: var(--c-strength); }
  .chip[data-cat="Row"] i { background: var(--c-row); }
  .chip[data-cat="Race"] i { background: var(--c-race); }
  .chip[data-cat="Rest"] i { background: var(--c-rest); }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  .pill[data-s="done"]   { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .pill[data-s="missed"] { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  .pill[data-s="today"]  { color: var(--accent); border-color: var(--accent); }
  @media (prefers-color-scheme: dark) { .pill[data-s="today"] { color: var(--series-actual); border-color: var(--series-actual); } }

  /* ---------- Progress ---------- */
  .bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 4px; background: var(--series-actual); min-width: 0; }

  /* ---------- Week summary ---------- */
  .wk-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .wk-summary .k { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); margin-bottom: 7px; }
  .wk-summary .k b { color: var(--ink); font-weight: 700; }

  /* ---------- Day / session rows ---------- */
  .day { padding: 14px 20px 6px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 92px 1fr; gap: 4px 16px; }
  .day:first-of-type { border-top: 0; }
  .day-label { padding-top: 6px; }
  .day-label b { display: block; font-size: 14px; }
  .day-label span { font-size: 12px; color: var(--muted); }
  .day.is-today { background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
  .day.is-today .day-label b::after { content: "Today"; margin-left: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
                                      color: var(--accent-ink); background: var(--accent); padding: 1px 6px; border-radius: 6px; vertical-align: 1px; }
  .sessions { min-width: 0; }
  .sess { display: grid; grid-template-columns: minmax(0, 1fr) 118px 170px 84px 52px; gap: 6px 14px; align-items: start; padding: 6px 0 12px; }
  .sess + .sess { border-top: 1px dashed var(--line); padding-top: 12px; }
  .sess-name { font-weight: 600; overflow-wrap: anywhere; }
  .sess-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .sess .lbl { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .sess .val { font-size: 13.5px; color: var(--ink-2); }
  .sess .var { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .sess[data-status="rest"] .sess-name, .sess[data-status="optional"] .sess-name { color: var(--ink-2); font-weight: 500; }
  .logged { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); display: grid; gap: 2px; }
  .logged.extra { color: var(--muted); }
  .logged div::before { content: "↳ "; color: var(--muted); }
  .sess.extra .sess-name { font-weight: 500; }
  .extra-tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); border: 1px dashed var(--line); padding: 1px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; }

  /* ---------- Week picker ---------- */
  .weekpick { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .weekpick a {
    text-decoration: none; text-align: center; padding: 8px 0 7px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14px; position: relative;
  }
  .weekpick a small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; margin-top: 1px; }
  .weekpick a:hover { background: var(--surface-2); }
  .weekpick a[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .weekpick a[aria-current="true"] small { color: inherit; opacity: .85; }
  .weekpick a.now::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--c-bike); }

  .week-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 20px 0; }
  .week-head h3 { font-size: 20px; letter-spacing: -.01em; }
  .week-head .grow { flex: 1; }
  .type-tag { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }

  /* ---------- Chart ---------- */
  .chart-card { padding: 16px 20px 12px; }
  .legend { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  #chart { position: relative; margin-top: 8px; }
  #chart svg { display: block; overflow: visible; }
  #chart .grid { stroke: var(--line); stroke-width: 1; }
  #chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  #chart text.strong { fill: var(--ink); font-weight: 700; }
  #chart .hit { fill: transparent; cursor: pointer; }
  #chart .hit:hover, #chart .hit.on { fill: color-mix(in srgb, var(--ink) 5%, transparent); }
  #chart .now-band { fill: var(--surface-2); }
  .tip {
    position: absolute; pointer-events: none; z-index: 5; background: var(--ink); color: var(--bg); padding: 8px 11px; border-radius: 9px;
    font-size: 12.5px; line-height: 1.5; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.25); transform: translate(-50%, -100%);
  }
  .tip b { display: block; margin-bottom: 2px; }
  .tip .row { display: flex; justify-content: space-between; gap: 18px; }

  table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.data th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.data tr:last-child td { border-bottom: 0; }
  table.data td.r, table.data th.r { text-align: right; white-space: nowrap; }
  table.data tr.clickable { cursor: pointer; }
  table.data tr.clickable:hover td { background: var(--surface-2); }
  .table-scroll { overflow-x: auto; }
  .muted { color: var(--muted); }
  .notes-cell { color: var(--ink-2); max-width: 260px; overflow-wrap: anywhere; }

  /* ---------- Filters ---------- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filters select, .filters input, .field select, .field input, .field textarea {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0;
  }
  .filters input[type=search] { width: 200px; }

  /* ---------- Recent list ---------- */
  .recent { list-style: none; margin: 0; padding: 0; }
  .recent li { display: grid; grid-template-columns: 84px 84px 1fr auto; gap: 12px; align-items: center; padding: 10px 20px; border-top: 1px solid var(--line); }
  .recent li:first-child { border-top: 0; }
  .recent .when { color: var(--muted); font-size: 13px; }
  .recent .what { overflow-wrap: anywhere; }
  .recent .stats { color: var(--ink-2); font-size: 13px; text-align: right; }

  /* ---------- Dialog ---------- */
  dialog { border: 1px solid var(--line); border-radius: 18px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 24px)); box-shadow: 0 24px 64px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(10,10,8,.5); }
  dialog form { padding: 20px; display: grid; gap: 14px; }
  dialog h2 { font-size: 18px; letter-spacing: -.01em; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .field { display: grid; gap: 5px; min-width: 0; }
  .field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field input, .field select, .field textarea { width: 100%; }
  .field textarea { resize: vertical; min-height: 60px; }
  .form-error { color: var(--bad); font-size: 13px; font-weight: 600; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .actions .spacer { flex: 1; }

  /* ---------- Review step + history ---------- */
  #review { padding: 20px; display: grid; gap: 14px; }
  #review[hidden] { display: none; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .hint.warn, .warn-box { color: var(--ink); }
  .hint.warn { color: var(--bad); font-weight: 600; }
  .warn-box { border: 1px solid var(--bad); border-radius: 10px; padding: 9px 12px; font-size: 13px; }
  .warn-box b { color: var(--bad); }
  .diff { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .diff-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 18px minmax(0, 1.4fr); gap: 8px 10px; padding: 10px 12px; align-items: baseline; font-size: 13.5px; }
  .diff-row + .diff-row { border-top: 1px solid var(--line); }
  .diff-row .k { color: var(--muted); font-size: 12px; font-weight: 600; }
  .diff-row .from { color: var(--muted); overflow-wrap: anywhere; }
  .diff-row .to { font-weight: 600; overflow-wrap: anywhere; }
  .diff-row .arrow { color: var(--muted); text-align: center; }
  .diff-row.plain { grid-template-columns: 96px minmax(0, 1fr); }
  .diff-row.plain .to { font-weight: 500; }
  .none { color: var(--muted); font-style: italic; font-weight: 400; }
  .hist-sub { color: var(--ink-2); font-size: 13px; }
  dialog form[hidden] { display: none; }
  .btn.danger-solid { background: var(--bad); border-color: var(--bad); color: var(--bg); }
  .btn.danger-solid:hover { filter: brightness(1.08); background: var(--bad); }

  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { padding: 14px 20px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .hist li:first-child { border-top: 0; }
  .hist-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .hist-head time { color: var(--muted); font-size: 13px; }
  .hist-head .title { font-weight: 600; overflow-wrap: anywhere; }
  .hist-head .id { color: var(--muted); font-size: 12px; }
  .hist-head .grow { flex: 1; }
  .rev-note { color: var(--muted); font-size: 12.5px; }
  .act-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); }
  .act-tag[data-a="INSERT"] { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .act-tag[data-a="DELETE"] { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  .hist .diff { max-width: 720px; }

  /* ---------- Misc ---------- */
  .empty { padding: 32px 20px; text-align: center; color: var(--muted); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 50; box-shadow: 0 8px 28px rgba(0,0,0,.3); }
  .toast.err { background: var(--bad); color: #fff; }
  .banner { margin: 16px 0; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--bad); color: var(--bad); font-weight: 600; }
  .loading { padding: 80px 0; text-align: center; color: var(--muted); }
  .two-col { display: grid; grid-template-columns: 1fr; gap: 20px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .weekpick { grid-template-columns: repeat(5, 1fr); }
    .sess { grid-template-columns: minmax(0, 1fr) auto; }
    .sess .c-target, .sess .c-actual { grid-column: 1 / -1; display: flex; gap: 8px; align-items: baseline; }
    .sess .c-target .lbl, .sess .c-actual .lbl { min-width: 52px; }
    .sess .c-status { grid-row: 1; grid-column: 2; }
    .sess .c-act { grid-column: 1 / -1; }
    .wk-summary { grid-template-columns: 1fr; gap: 14px; }
  }
  @media (max-width: 600px) {
    nav.tabs { margin-left: 0; width: 100%; }
    nav.tabs a { flex: 1; text-align: center; padding: 7px 4px; font-size: 13px; white-space: nowrap; }
    .diff-row { grid-template-columns: 1fr; gap: 2px; }
    .diff-row .arrow { display: none; }
    .diff-row .from::before { content: "Was: "; }
    .diff-row .to::before { content: "Now: "; font-weight: 400; color: var(--muted); }
    .diff-row.plain { grid-template-columns: 84px minmax(0, 1fr); gap: 8px; }
    .diff-row.plain .to::before { content: none; }
    #review, dialog form { padding: 16px; }
    .hist li { padding: 12px 14px; }
    .day { grid-template-columns: 1fr; padding: 12px 14px 4px; }
    .day-label { display: flex; gap: 8px; align-items: baseline; padding-top: 0; }
    .recent li { grid-template-columns: 1fr auto; padding: 10px 14px; }
    .recent .when { grid-column: 1; }
    .recent .chipcell { grid-column: 2; grid-row: 1; justify-self: end; }
    .recent .what { grid-column: 1 / -1; }
    .recent .stats { grid-column: 1 / -1; text-align: left; }
    .grid3 { grid-template-columns: 1fr 1fr; }
    .week-head, .wk-summary { padding-left: 14px; padding-right: 14px; }
    .tile .value { font-size: 26px; }
  }
  @media (prefers-reduced-motion: no-preference) { .btn { transition: background .12s, filter .12s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M8 21l5-9 4 6 3-4 4 7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Marathon Training
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#/dashboard" data-tab="dashboard">Dashboard</a>
      <a href="#/plan" data-tab="plan">Plan</a>
      <a href="#/log" data-tab="log">Activity log</a>
      <a href="#/history" data-tab="history">History</a>
    </nav>
  </header>
  <main id="app"><div class="loading">Loading…</div></main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="form" method="dialog" novalidate>
    <h2 id="dlg-title">Log activity</h2>
    <div class="grid2">
      <label class="field"><span>Date</span><input type="date" name="activity_date" required></label>
      <label class="field"><span>Category</span>
        <select name="category" required>
          <option>Run</option><option>Bike</option><option>Strength</option><option>Row</option><option>Race</option><option>Rest</option>
        </select>
      </label>
    </div>
    <label class="field"><span>Session</span><input type="text" name="actual_session" required placeholder="e.g. 45 min Power Zone Ride — Matt Wilpers"></label>
    <div class="grid3">
      <label class="field"><span>Distance (mi)</span><input type="number" name="distance_mi" step="0.01" min="0" inputmode="decimal"></label>
      <label class="field"><span>Duration (min)</span><input type="number" name="duration_min" step="0.1" min="0" inputmode="decimal"></label>
      <label class="field"><span>Output (kJ)</span><input type="number" name="output_kj" step="0.1" min="0" inputmode="decimal"></label>
    </div>
    <div class="field"><label for="plan-select"><span>Counts toward planned session</span></label><select name="plan_id" id="plan-select"></select>
      <div class="hint" id="plan-hint" aria-live="polite"></div></div>
    <label class="field"><span>Notes</span><textarea name="notes" rows="2"></textarea></label>
    <div class="form-error" id="form-error" role="alert"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="btn-delete" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="btn-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="btn-save">Save</button>
    </div>
  </form>
  <div id="review" hidden>
    <h2 id="review-title"></h2>
    <div id="review-body"></div>
    <div class="form-error" id="review-error" role="alert"></div>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" class="btn" id="review-back">Back</button>
      <button type="button" class="btn primary" id="review-confirm">Confirm</button>
    </div>
  </div>
</dialog>

<script>
"use strict";

/* ====================================================================
   Tiny safe-by-default templating: interpolated values are HTML-escaped
   unless they come from another html`` call.
   ==================================================================== */
class Raw { constructor(s) { this.s = s; } }
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ESC[c]);
const render = v => v instanceof Raw ? v.s : Array.isArray(v) ? v.map(render).join("") : (v === false || v == null) ? "" : esc(v);
const html = (strs, ...vals) => new Raw(strs.reduce((out, s, i) => out + s + (i < vals.length ? render(vals[i]) : ""), ""));

/* ====================================================================
   Formatting
   ==================================================================== */
const parseDate = iso => new Date(iso + "T00:00:00");
const fmtDate = (iso, opts = { weekday: "short", month: "short", day: "numeric" }) => parseDate(iso).toLocaleDateString(undefined, opts);
const fmtMi = x => x == null ? "—" : `${+Number(x).toFixed(2)} mi`;
const fmtMin = m => {
  if (m == null) return "—";
  m = Math.round(m);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
};
const fmtSigned = (x, unit) => x === 0 ? "" : `${x > 0 ? "+" : "−"}${+Math.abs(x).toFixed(2)} ${unit}`;
const pace = (mi, min) => {
  if (!mi || !min) return "";
  const p = min / mi, m = Math.floor(p), s = Math.round((p - m) * 60);
  return s === 60 ? `${m + 1}:00 /mi` : `${m}:${String(s).padStart(2, "0")} /mi`;
};
const isRun = c => c === "Run" || c === "Race";
const chip = cat => html`<span class="chip" data-cat="${cat}"><i></i>${cat}</span>`;
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

const STATUS = {
  done:     { icon: "✓", label: "Done" },
  missed:   { icon: "✕", label: "Missed" },
  today:    { icon: "●", label: "Today" },
  upcoming: { icon: "○", label: "Upcoming" },
  optional: { icon: "◌", label: "Optional" },
  rest:     { icon: "", label: "Rest" },
};
const pill = s => html`<span class="pill" data-s="${s}">${STATUS[s].icon} ${STATUS[s].label}</span>`;

/* ====================================================================
   State + data
   ==================================================================== */
const state = {
  data: null,
  error: null,
  filters: { category: "", week: "", q: "" },
  chartTable: false,
  history: null,
  historyLoading: false,
  historyError: null,
};
const $app = document.getElementById("app");

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      detail = Array.isArray(body.detail) ? body.detail.map(d => `${(d.loc || []).slice(1).join(".")}: ${d.msg}`).join("; ") : body.detail || detail;
    } catch { /* keep statusText */ }
    throw new Error(detail);
  }
  return res.json();
}

async function load() {
  try {
    state.data = await api("/api/data");
    state.error = null;
    state.history = null; // any load follows a change; refetch history when it's next viewed
  } catch (e) {
    state.error = e.message;
  }
  route();
}

function toast(msg, isErr = false) {
  const t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : "");
  t.textContent = msg;
  t.setAttribute("role", "status");
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ====================================================================
   Router
   ==================================================================== */
function parseRoute() {
  const [, tab = "dashboard", arg] = location.hash.split("/");
  return { tab: ["dashboard", "plan", "log", "history"].includes(tab) ? tab : "dashboard", arg };
}

function route() {
  const { tab, arg } = parseRoute();
  document.querySelectorAll("nav.tabs a").forEach(a => {
    if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (state.error) {
    $app.innerHTML = html`<div class="banner">Couldn't load your data: ${state.error}. Is the server running?</div>
      <button class="btn" data-action="reload">Try again</button>`.s;
    return;
  }
  if (!state.data) return;
  const view = { dashboard: viewDashboard, plan: viewPlan, log: viewLog, history: viewHistory }[tab];
  $app.innerHTML = view(arg).s;
  if (tab === "dashboard") drawChart();
  document.title = { dashboard: "Dashboard", plan: "Plan", log: "Activity log", history: "History" }[tab] + " · Marathon Training";
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

/* ====================================================================
   Shared: week detail (used by Dashboard + Plan)
   ==================================================================== */
const focusWeek = () => Math.min(Math.max(state.data.summary.current_week, 1), state.data.summary.last_week);

function progressBar(actual, planned) {
  const pct = planned > 0 ? Math.min(100, (actual / planned) * 100) : 0;
  return html`<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><span style="width:${pct}%"></span></div>`;
}

function weekDetail(weekNo) {
  const { plan, activities, weeks, summary } = state.data;
  const wk = weeks.find(w => w.week === weekNo);
  const rows = plan.filter(p => p.week === weekNo);
  const acts = activities.filter(a => a.week === weekNo);
  const linkedActs = id => acts.filter(a => a.plan_id === id);

  const days = DAYS.map(day => {
    const date = rows.find(r => r.day === day)?.date;
    const dayRows = rows.filter(r => r.day === day);
    const extras = acts.filter(a => a.activity_date === date && !a.plan_id);
    return html`
      <section class="day ${date === summary.today ? "is-today" : ""}">
        <div class="day-label"><b>${day}</b><span>${fmtDate(date, { month: "short", day: "numeric" })}</span></div>
        <div class="sessions">
          ${dayRows.map(r => sessionRow(r, linkedActs(r.plan_id)))}
          ${extras.map(extraRow)}
        </div>
      </section>`;
  });

  return html`
    <div class="card">
      <div class="week-head">
        <h3>Week ${weekNo}</h3>
        <span class="type-tag">${wk.week_type}</span>
        <span class="muted">${fmtDate(wk.start, { month: "short", day: "numeric" })} – ${fmtDate(wk.end, { month: "short", day: "numeric" })}</span>
        <span class="grow"></span>
      </div>
      <div class="wk-summary" style="border-bottom:1px solid var(--line)">
        <div><div class="k"><span>Run miles</span><b class="num">${fmtMi(wk.actual_run_mi)} <span class="muted">/ ${fmtMi(wk.planned_run_mi)}</span></b></div>${progressBar(wk.actual_run_mi, wk.planned_run_mi)}</div>
        <div><div class="k"><span>Training time</span><b class="num">${fmtMin(wk.actual_min)} <span class="muted">/ ${fmtMin(wk.planned_min)}</span></b></div>${progressBar(wk.actual_min, wk.planned_min)}</div>
        <div><div class="k"><span>Sessions done</span><b class="num">${wk.sessions_done} <span class="muted">/ ${wk.sessions_planned}</span></b></div>${progressBar(wk.sessions_done, wk.sessions_planned)}</div>
      </div>
      ${days}
    </div>`;
}

function sessionRow(r, linked) {
  const isRest = r.category === "Rest";
  const hasTarget = r.target_distance_mi != null || r.target_duration_min != null;
  const targetTxt = [r.target_distance_mi != null ? fmtMi(r.target_distance_mi) : null, r.target_duration_min != null ? fmtMin(r.target_duration_min) : null].filter(Boolean).join(" · ");
  const done = r.linked_activity_count > 0;
  const actualTxt = [r.actual_distance_mi > 0 ? fmtMi(r.actual_distance_mi) : null, r.actual_duration_min > 0 ? fmtMin(r.actual_duration_min) : null].filter(Boolean).join(" · ") || "Logged";
  const variance = done && hasTarget
    ? (r.target_distance_mi != null ? fmtSigned(r.distance_variance_mi, "mi") : fmtSigned(r.duration_variance_min, "min"))
    : "";
  const meta = [r.run_subtype && r.run_subtype !== "Long Run" ? r.run_subtype : null, r.notes].filter(Boolean).join(" · ");
  return html`
    <div class="sess" data-status="${r.status}">
      <div>
        <div class="sess-name">${chip(r.category)} &nbsp;${r.planned_session}</div>
        ${meta ? html`<div class="sess-meta">${meta}</div>` : ""}
      </div>
      <div class="c-target">${isRest || !hasTarget ? "" : html`<span class="lbl">Target</span><span class="val num">${targetTxt}</span>`}</div>
      <div class="c-actual">${done ? html`<span class="lbl">Actual</span><span class="val num">${actualTxt}${variance ? html`<span class="var">${variance}</span>` : ""}</span>` : ""}</div>
      <div class="c-status">${pill(r.status)}</div>
      <div class="c-act">${!isRest && !done ? html`<button class="btn small" data-action="log-plan" data-id="${r.plan_id}" title="Log this session">Log</button>` : ""}</div>
      ${linked.length ? html`<div class="logged">${linked.map(a => html`<div>${a.actual_session}${a.distance_mi && isRun(a.category) ? html` <span class="muted">· ${pace(a.distance_mi, a.duration_min)}</span>` : ""}</div>`)}</div>` : ""}
    </div>`;
}

function extraRow(a) {
  return html`
    <div class="sess extra" data-status="extra">
      <div>
        <div class="sess-name">${chip(a.category)} &nbsp;${a.actual_session}<span class="extra-tag">Unplanned</span></div>
        ${a.notes ? html`<div class="sess-meta">${a.notes}</div>` : ""}
      </div>
      <div class="c-target"></div>
      <div class="c-actual"><span class="lbl">Actual</span><span class="val num">${[a.distance_mi ? fmtMi(a.distance_mi) : null, a.duration_min ? fmtMin(a.duration_min) : null].filter(Boolean).join(" · ") || "—"}</span></div>
      <div class="c-status"></div>
      <div class="c-act"><button class="btn small ghost" data-action="edit" data-id="${a.activity_id}">Edit</button></div>
    </div>`;
}

/* ====================================================================
   Dashboard
   ==================================================================== */
function viewDashboard() {
  const { summary: s, activities } = state.data;
  const fw = focusWeek();
  const before = s.current_week < 1, after = s.current_week > s.last_week;
  const adherence = s.sessions_due ? Math.round((s.sessions_done / s.sessions_due) * 100) : null;
  const raceLabel = fmtDate(s.race_date, { weekday: "short", month: "short", day: "numeric", year: "numeric" });

  return html`
    <div class="tiles">
      <div class="card tile">
        <div class="label">Race day</div>
        <div class="value num">${s.days_to_race > 0 ? s.days_to_race : s.days_to_race === 0 ? "Today" : "Done"} ${s.days_to_race > 0 ? html`<small>days</small>` : ""}</div>
        <div class="note">${raceLabel}</div>
      </div>
      <div class="card tile">
        <div class="label">Training week</div>
        <div class="value num">${before ? "Starts soon" : after ? "Complete" : html`${s.current_week} <small>of ${s.last_week}</small>`}</div>
        <div class="note">${state.data.weeks.find(w => w.week === fw).week_type} week</div>
      </div>
      <div class="card tile">
        <div class="label">Miles run</div>
        <div class="value num">${+s.total_run_mi.toFixed(1)} <small>mi</small></div>
        <div class="note">${+s.planned_run_mi_to_date.toFixed(1)} mi planned so far</div>
      </div>
      <div class="card tile">
        <div class="label">Plan adherence</div>
        <div class="value num">${adherence == null ? "—" : html`${adherence}<small>%</small>`}</div>
        <div class="note">${s.sessions_done} of ${s.sessions_due} due sessions done</div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Weekly run miles</h2><span class="sub">Planned vs. actual across the 20-week plan</span><span class="spacer"></span>
        <button class="btn small" data-action="toggle-chart-table">${state.chartTable ? "Show chart" : "Show table"}</button></div>
      <div class="card chart-card">
        <div class="legend"><span><i style="background:var(--series-planned)"></i>Planned</span><span><i style="background:var(--series-actual)"></i>Actual</span></div>
        <div id="chart"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>${before ? "First week" : after ? "Final week" : "This week"}</h2><span class="spacer"></span>
        <a class="btn small" href="#/plan/${fw}">Open in Plan</a></div>
      ${weekDetail(fw)}
    </div>

    <div class="section">
      <div class="section-head"><h2>Recent activity</h2><span class="spacer"></span>
        <button class="btn small primary" data-action="new">+ Log activity</button>
        <a class="btn small" href="#/log">All ${s.activity_count}</a></div>
      <div class="card">
        ${activities.length ? html`<ul class="recent">${activities.slice(0, 6).map(a => html`
          <li>
            <span class="when">${fmtDate(a.activity_date, { month: "short", day: "numeric" })}</span>
            <span class="chipcell">${chip(a.category)}</span>
            <span class="what">${a.actual_session}</span>
            <span class="stats num">${activityStats(a)}</span>
          </li>`)}</ul>` : html`<div class="empty">No activity logged yet.</div>`}
      </div>
    </div>`;
}

function activityStats(a) {
  return [a.distance_mi ? fmtMi(a.distance_mi) : null, a.duration_min ? fmtMin(a.duration_min) : null,
          a.distance_mi && isRun(a.category) ? pace(a.distance_mi, a.duration_min) : null,
          a.output_kj ? `${+a.output_kj.toFixed(0)} kJ` : null].filter(Boolean).join(" · ");
}

/* ---------- Chart (hand-rolled SVG: planned vs actual run miles per week) ---------- */
function drawChart() {
  const el = document.getElementById("chart");
  if (!el) return;
  const { weeks, summary } = state.data;

  if (state.chartTable) {
    el.innerHTML = html`<div class="table-scroll"><table class="data num">
      <thead><tr><th>Week</th><th>Type</th><th class="r">Planned mi</th><th class="r">Actual mi</th><th class="r">Planned time</th><th class="r">Actual time</th></tr></thead>
      <tbody>${weeks.map(w => html`<tr class="clickable" data-action="goto-week" data-week="${w.week}">
        <td>${w.week}</td><td>${w.week_type}</td><td class="r">${+w.planned_run_mi.toFixed(1)}</td>
        <td class="r">${w.week <= summary.current_week ? +w.actual_run_mi.toFixed(1) : "—"}</td>
        <td class="r">${fmtMin(w.planned_min)}</td><td class="r">${w.week <= summary.current_week ? fmtMin(w.actual_min) : "—"}</td></tr>`)}</tbody>
    </table></div>`.s;
    return;
  }

  const W = el.clientWidth || 640, H = 250;
  const m = { l: 34, r: 6, t: 14, b: 28 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const max = Math.max(...weeks.map(w => Math.max(w.planned_run_mi, w.actual_run_mi)), 5);
  const step = max <= 20 ? 5 : 10;
  const top = Math.ceil(max / step) * step;
  const y = v => m.t + ph - (v / top) * ph;
  const gw = pw / weeks.length;
  const bw = Math.max(3, Math.min(24, (gw - 8) / 2));
  const labelEvery = gw >= 26 ? 1 : gw >= 16 ? 2 : 5;

  const barPath = (x, val) => {
    const h = (val / top) * ph;
    if (h <= 0) return "";
    const r = Math.min(4, bw / 2, h);
    const yy = m.t + ph - h;
    return `M${x},${m.t + ph}V${yy + r}Q${x},${yy} ${x + r},${yy}H${x + bw - r}Q${x + bw},${yy} ${x + bw},${yy + r}V${m.t + ph}Z`;
  };

  let g = "";
  for (let v = 0; v <= top; v += step) {
    g += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  weeks.forEach((w, i) => {
    const x0 = m.l + i * gw, cx = x0 + gw / 2;
    const isNow = w.week === summary.current_week;
    if (isNow) g += `<rect class="now-band" x="${x0 + 1}" y="${m.t}" width="${gw - 2}" height="${ph}" rx="6"/>`;
    g += `<path d="${barPath(cx - bw - 1, w.planned_run_mi)}" fill="var(--series-planned)"/>`;
    if (w.week <= summary.current_week) g += `<path d="${barPath(cx + 1, w.actual_run_mi)}" fill="var(--series-actual)"/>`;
    if (isNow || w.week % labelEvery === 0 || w.week === 1) g += `<text class="${isNow ? "strong" : ""}" x="${cx}" y="${H - 8}" text-anchor="middle">${w.week}</text>`;
    g += `<rect class="hit" data-week="${w.week}" x="${x0}" y="${m.t}" width="${gw}" height="${ph + m.b - 14}"/>`;
  });

  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Planned versus actual run miles for each of ${weeks.length} plan weeks. Use the table view for exact values.">${g}</svg>`;
  el.querySelectorAll(".hit").forEach(r => {
    r.addEventListener("mouseenter", e => showTip(el, +r.dataset.week, r, W));
    r.addEventListener("mouseleave", hideTip);
    r.addEventListener("click", () => { location.hash = `#/plan/${r.dataset.week}`; });
  });
}

function showTip(el, weekNo, rect, W) {
  hideTip();
  const { weeks, summary } = state.data;
  const w = weeks.find(x => x.week === weekNo);
  const started = w.week <= summary.current_week;
  const tip = document.createElement("div");
  tip.className = "tip";
  tip.innerHTML = html`<b>Week ${w.week} · ${w.week_type}</b>
    <div class="row"><span>Planned</span><span class="num">${+w.planned_run_mi.toFixed(1)} mi</span></div>
    <div class="row"><span>Actual</span><span class="num">${started ? `${+w.actual_run_mi.toFixed(1)} mi` : "—"}</span></div>`.s;
  el.appendChild(tip);
  const cx = +rect.getAttribute("x") + +rect.getAttribute("width") / 2;
  const half = tip.offsetWidth / 2;
  tip.style.left = Math.min(Math.max(cx, half), W - half) + "px";
  tip.style.top = (+rect.getAttribute("y") + 8) + "px";
  rect.classList.add("on");
}
function hideTip() {
  document.querySelectorAll(".tip").forEach(t => t.remove());
  document.querySelectorAll(".hit.on").forEach(r => r.classList.remove("on"));
}

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (parseRoute().tab === "dashboard" && state.data) drawChart(); }, 120); });

/* ====================================================================
   Plan
   ==================================================================== */
function viewPlan(arg) {
  const { weeks, summary } = state.data;
  const sel = Math.min(Math.max(parseInt(arg, 10) || focusWeek(), 1), summary.last_week);
  const short = { Normal: "", "Step-back": "Step-back", Taper: "Taper", Peak: "Peak", Race: "Race" };
  return html`
    <div class="section" style="margin-top:4px">
      <div class="section-head"><h2>Training plan</h2><span class="sub">${summary.last_week} weeks · ${fmtDate(summary.plan_start, { month: "short", day: "numeric", year: "numeric" })} → ${fmtDate(summary.race_date, { month: "short", day: "numeric", year: "numeric" })}</span></div>
      <nav class="weekpick" aria-label="Pick a week">
        ${weeks.map(w => html`<a href="#/plan/${w.week}" ${w.week === sel ? html`aria-current="true"` : ""} class="${w.week === summary.current_week ? "now" : ""}" title="Week ${w.week} · ${w.week_type}">${w.week}<small>${short[w.week_type] || html`&nbsp;`}</small></a>`)}
      </nav>
    </div>
    <div class="section">${weekDetail(sel)}</div>`;
}

/* ====================================================================
   Activity log
   ==================================================================== */
function viewLog() {
  const { activities, weeks } = state.data;
  const f = state.filters;
  const q = f.q.trim().toLowerCase();
  const list = activities.filter(a =>
    (!f.category || a.category === f.category) &&
    (!f.week || String(a.week) === f.week) &&
    (!q || `${a.actual_session} ${a.notes || ""}`.toLowerCase().includes(q)));
  const totals = list.reduce((t, a) => ({ mi: t.mi + (isRun(a.category) ? a.distance_mi || 0 : 0), min: t.min + (a.duration_min || 0) }), { mi: 0, min: 0 });
  const planName = id => {
    const p = state.data.plan.find(p => p.plan_id === id);
    return p ? html`<span class="muted" title="${p.planned_session}">${p.plan_id}</span>` : html`<span class="muted">—</span>`;
  };

  return html`
    <div class="section" style="margin-top:4px">
      <div class="section-head"><h2>Activity log</h2>
        <span class="sub num">${list.length} ${list.length === 1 ? "activity" : "activities"} · ${fmtMi(totals.mi)} run · ${fmtMin(totals.min)}</span>
        <span class="spacer"></span>
        <button class="btn primary" data-action="new">+ Log activity</button></div>
      <div class="filters" style="margin-bottom:12px">
        <select data-filter="category" aria-label="Category"><option value="">All categories</option>
          ${["Run", "Bike", "Strength", "Row", "Race", "Rest"].map(c => html`<option ${f.category === c ? "selected" : ""}>${c}</option>`)}</select>
        <select data-filter="week" aria-label="Week"><option value="">All weeks</option>
          ${weeks.map(w => html`<option value="${w.week}" ${f.week === String(w.week) ? "selected" : ""}>Week ${w.week}</option>`)}</select>
        <input type="search" data-filter="q" placeholder="Search sessions & notes" value="${f.q}" aria-label="Search">
      </div>
      <div class="card">
        ${list.length ? html`<div class="table-scroll"><table class="data">
          <thead><tr><th>Date</th><th>Category</th><th>Session</th><th class="r">Distance</th><th class="r">Time</th><th class="r">Pace</th><th class="r">kJ</th><th>Plan</th><th>Notes</th></tr></thead>
          <tbody>${list.map(a => html`<tr class="clickable" data-action="edit" data-id="${a.activity_id}" tabindex="0" title="Click to edit">
            <td class="num" style="white-space:nowrap">${fmtDate(a.activity_date)}</td>
            <td>${chip(a.category)}</td>
            <td>${a.actual_session}</td>
            <td class="r num">${a.distance_mi ? fmtMi(a.distance_mi) : html`<span class="muted">—</span>`}</td>
            <td class="r num">${a.duration_min ? fmtMin(a.duration_min) : html`<span class="muted">—</span>`}</td>
            <td class="r num">${isRun(a.category) && a.distance_mi ? pace(a.distance_mi, a.duration_min) : html`<span class="muted">—</span>`}</td>
            <td class="r num">${a.output_kj ? +a.output_kj.toFixed(0) : html`<span class="muted">—</span>`}</td>
            <td style="white-space:nowrap">${planName(a.plan_id)}</td>
            <td class="notes-cell">${a.notes || ""}</td></tr>`)}</tbody>
        </table></div>` : html`<div class="empty">No activities match these filters.</div>`}
      </div>
    </div>`;
}

/* ====================================================================
   Change diffs (shared by the confirmation step and the History tab)
   ==================================================================== */
const FIELDS = [
  ["activity_date", "Date"], ["category", "Category"], ["actual_session", "Session"], ["distance_mi", "Distance"],
  ["duration_min", "Duration"], ["output_kj", "Output"], ["plan_id", "Plan link"], ["notes", "Notes"],
];
const FIELD_LABEL = Object.fromEntries(FIELDS);
const norm = v => v === "" || v == null ? null : v;

function planLabel(id) {
  const p = state.data.plan.find(p => p.plan_id === id);
  return p ? `${id} · ${p.planned_session}` : id;
}

function fmtField(field, v) {
  v = norm(v);
  if (v == null) return html`<span class="none">none</span>`;
  switch (field) {
    case "activity_date": return fmtDate(v, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    case "distance_mi": return `${+Number(v).toFixed(2)} mi`;
    case "duration_min": return `${+Number(v).toFixed(1)} min`;
    case "output_kj": return `${+Number(v).toFixed(1)} kJ`;
    case "plan_id": return planLabel(v);
    default: return String(v);
  }
}

const diffActivity = (a, b) => FIELDS
  .filter(([k]) => norm(a[k]) !== norm(b[k]))
  .map(([k]) => ({ field: k, old: norm(a[k]), new: norm(b[k]) }));

const diffRows = changes => html`<div class="diff">${changes.map(c => html`
  <div class="diff-row"><span class="k">${FIELD_LABEL[c.field]}</span><span class="from">${fmtField(c.field, c.old)}</span><span class="arrow" aria-label="changed to">→</span><span class="to">${fmtField(c.field, c.new)}</span></div>`)}</div>`;

const detailRows = a => html`<div class="diff">${FIELDS.filter(([k]) => norm(a[k]) != null).map(([k, l]) => html`
  <div class="diff-row plain"><span class="k">${l}</span><span class="to">${fmtField(k, a[k])}</span></div>`)}</div>`;

/* ====================================================================
   History tab
   ==================================================================== */
const ACTION_LABEL = { INSERT: "Added", UPDATE: "Edited", DELETE: "Deleted" };

async function loadHistory() {
  if (state.historyLoading) return;
  state.historyLoading = true;
  try { state.history = await api("/api/history"); state.historyError = null; }
  catch (e) { state.history = []; state.historyError = e.message; }
  state.historyLoading = false;
  if (parseRoute().tab === "history") route();
}

function fmtStamp(iso) {
  const d = new Date(iso);
  const opts = { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleString(undefined, opts);
}

function viewHistory() {
  if (state.history == null) { loadHistory(); return html`<div class="loading">Loading history…</div>`; }
  const revertedIds = new Set(state.history.filter(x => x.reverts).map(x => x.reverts));
  const stampOf = id => { const t = state.history.find(x => x.history_id === id); return t ? fmtStamp(t.changed_at) : "an earlier change"; };
  const summarize = r => [fmtDate(r.activity_date), r.category, activityStats(r), r.plan_id ? `linked to ${r.plan_id}` : null].filter(Boolean).join(" · ");
  return html`
    <div class="section" style="margin-top:4px">
      <div class="section-head"><h2>History</h2>
        <span class="sub">Every add, edit and delete in the activity log, including changes made outside this app</span></div>
      ${state.historyError ? html`<div class="banner">Couldn't load history: ${state.historyError}</div>` : ""}
      <div class="card">
        ${state.history.length ? html`<ul class="hist">${state.history.map(e => {
          const row = e.new || e.old;
          const rv = revertInfo(e, revertedIds);
          return html`<li>
            <div class="hist-head">
              <span class="act-tag" data-a="${e.action}">${ACTION_LABEL[e.action]}</span>
              <span class="title">${row.actual_session}</span>
              <span class="id num">#${e.activity_id}</span>
              <time datetime="${e.changed_at}" class="num">${fmtStamp(e.changed_at)}</time>
              <span class="grow"></span>
              ${rv.ok ? html`<button class="btn small" data-action="revert" data-id="${e.history_id}">${rv.label}</button>` : html`<span class="rev-note">${rv.note}</span>`}
            </div>
            ${e.reverts ? html`<div class="rev-note">↩ Reverted the change from ${stampOf(e.reverts)}</div>` : ""}
            ${e.action === "UPDATE" ? diffRows(e.changes) : html`<div class="hist-sub">${summarize(row)}</div>`}
          </li>`;
        })}</ul>` : html`<div class="empty">No changes recorded yet. From now on, every add, edit and delete in the activity log shows up here.</div>`}
      </div>
    </div>`;
}

/* ====================================================================
   Activity dialog (create / edit / delete)
   ==================================================================== */
const dlg = document.getElementById("dlg");
const form = document.getElementById("form");
const $err = document.getElementById("form-error");
let editingId = null;
let editingOrig = null;   // the activity as loaded when the dialog opened (diff baseline)
let pendingAction = null; // what the review step's Confirm button will run
let reviewOnly = false;   // review opened on its own (Revert), so Back should close the dialog
const $ = id => document.getElementById(id);

function planOptions(dateIso, selected) {
  const rows = state.data.plan.filter(p => p.category !== "Rest" || p.plan_id === selected);
  const label = p => `W${p.week} ${p.day} · ${p.planned_session}`;
  const same = rows.filter(p => p.date === dateIso);
  const rest = rows.filter(p => p.date !== dateIso);
  const opt = p => html`<option value="${p.plan_id}" ${p.plan_id === selected ? "selected" : ""}>${label(p)}</option>`;
  const byWeek = {};
  rest.forEach(p => (byWeek[p.week] ||= []).push(p));
  return html`<option value="">— Not linked (unplanned) —</option>
    ${same.length ? html`<optgroup label="Planned for this date">${same.map(opt)}</optgroup>` : ""}
    ${Object.entries(byWeek).map(([w, ps]) => html`<optgroup label="Week ${w}">${ps.map(opt)}</optgroup>`)}`.s;
}

function refreshPlanSelect() {
  const sel = form.elements.plan_id;
  sel.innerHTML = planOptions(form.elements.activity_date.value, sel.value || "");
}

/* Warnings about linking an activity to a planned session. */
function planLinkWarnings(planId, dateIso) {
  const p = planId && state.data.plan.find(x => x.plan_id === planId);
  if (!p) return [];
  const out = [];
  if (p.date !== dateIso) out.push(`${p.plan_id} is planned for ${fmtDate(p.date)}, but this activity is dated ${fmtDate(dateIso)}.`);
  const others = p.linked_activity_count - (editingOrig?.plan_id === planId ? 1 : 0);
  if (others > 0) out.push(`${p.plan_id} already has ${others} other logged ${others === 1 ? "activity" : "activities"}; this one would count toward its totals too.`);
  return out;
}

function updatePlanHint() {
  const w = planLinkWarnings(form.elements.plan_id.value, form.elements.activity_date.value);
  const el = $("plan-hint");
  el.className = "hint" + (w.length ? " warn" : "");
  el.textContent = w.join(" ");
}

function hideReview() {
  $("review").hidden = true;
  form.hidden = false;
  pendingAction = null;
  reviewOnly = false;
  $("review-back").textContent = "Back";
}

function showReview({ title, body, confirmLabel, danger = false, action, standalone = false }) {
  $("review-title").textContent = title;
  $("review-body").innerHTML = body.s;
  $("review-error").textContent = "";
  const c = $("review-confirm");
  c.textContent = confirmLabel;
  c.className = "btn " + (danger ? "danger-solid" : "primary");
  pendingAction = action;
  reviewOnly = standalone;
  $("review-back").textContent = standalone ? "Cancel" : "Back";
  form.hidden = true;
  $("review").hidden = false;
  if (standalone && !dlg.open) dlg.showModal();
  c.focus();
}

/* ---------- Revert (History tab) ---------- */
function revertInfo(e, revertedIds = new Set(state.history.filter(x => x.reverts).map(x => x.reverts))) {
  if (revertedIds.has(e.history_id)) return { ok: false, note: "Reverted" };
  const cur = state.data.activities.find(a => a.activity_id === e.activity_id);
  if (e.action === "INSERT") return cur ? { ok: true, label: "Undo add", cur } : { ok: false, note: "Already removed" };
  if (e.action === "DELETE") return cur ? { ok: false, note: "Already restored" } : { ok: true, label: "Restore" };
  if (!cur) return { ok: false, note: "Activity deleted since" };
  // Only the fields this edit changed, and only if they don't already hold the old value.
  const remaining = e.changes.filter(c => norm(cur[c.field]) !== norm(c.old));
  if (!remaining.length) return { ok: false, note: "Already at these values" };
  const stale = e.changes.filter(c => norm(cur[c.field]) !== norm(c.new) && norm(cur[c.field]) !== norm(c.old)).length;
  return {
    ok: true, label: "Revert", cur, stale,
    changes: remaining.map(c => ({ field: c.field, old: norm(cur[c.field]), new: norm(c.old) })), // current -> restored
  };
}

function startRevert(historyId) {
  const e = state.history?.find(x => x.history_id === historyId);
  if (!e) return;
  const rv = revertInfo(e);
  if (!rv.ok) { toast(rv.note, true); return; }
  const name = (e.new || e.old).actual_session;
  const note = text => html`<p class="hist-sub" style="margin-bottom:12px">${text}</p>`;
  const cfg = {
    UPDATE: () => ({
      title: "Revert this edit?", confirmLabel: "Revert changes", done: "Change reverted",
      body: html`${note(html`Restores these fields on <b>${name}</b>. Its other fields stay as they are.`)}${diffRows(rv.changes)}${rv.stale
        ? html`<div class="warn-box" style="margin-top:12px"><b>Edited since:</b> ${rv.stale === 1 ? "one of these fields was" : `${rv.stale} of these fields were`} changed again after this edit. Reverting overwrites the newer value.</div>` : ""}`,
    }),
    INSERT: () => ({
      title: "Undo this add?", confirmLabel: "Delete activity", danger: true, done: "Activity removed",
      body: html`${note("This removes the activity that was added.")}${detailRows(rv.cur)}`,
    }),
    DELETE: () => ({
      title: "Restore this activity?", confirmLabel: "Restore activity", done: "Activity restored",
      body: html`${note("This re-creates the deleted activity, with its original ID and values.")}${detailRows(e.old)}`,
    }),
  }[e.action]();  // lazy: each variant's body only makes sense for its own kind of entry
  showReview({
    ...cfg, standalone: true,
    action: async () => {
      await api(`/api/history/${historyId}/revert`, { method: "POST" });
      dlg.close();
      toast(cfg.done);
      await load();
    },
  });
}

function openDialog(activity, prefill = {}) {
  hideReview();
  editingId = activity?.activity_id ?? null;
  editingOrig = activity ? { ...activity } : null;
  const v = activity ?? {
    activity_date: state.data.summary.today, category: "Run", actual_session: "", distance_mi: null,
    duration_min: null, output_kj: null, plan_id: "", notes: "", ...prefill,
  };
  document.getElementById("dlg-title").textContent = editingId ? "Edit activity" : "Log activity";
  document.getElementById("btn-delete").hidden = !editingId;
  $err.textContent = "";
  const f = form.elements;
  f.activity_date.value = v.activity_date;
  f.category.value = v.category;
  f.actual_session.value = v.actual_session;
  f.distance_mi.value = v.distance_mi ?? "";
  f.duration_min.value = v.duration_min ?? "";
  f.output_kj.value = v.output_kj ?? "";
  f.notes.value = v.notes ?? "";
  f.plan_id.innerHTML = planOptions(v.activity_date, v.plan_id || "");
  f.plan_id.value = v.plan_id || "";
  updatePlanHint();
  dlg.showModal();
  f.actual_session.focus();
}

const num = s => s === "" || s == null ? null : Number(s);

async function saveActivity(body) {
  const wasEdit = editingId != null;
  await api(wasEdit ? `/api/activities/${editingId}` : "/api/activities", {
    method: wasEdit ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  dlg.close();
  toast(wasEdit ? "Activity updated" : "Activity logged");
  await load();
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const f = form.elements;
  if (!f.activity_date.value || !f.actual_session.value.trim()) { $err.textContent = "Date and session are required."; return; }
  const body = {
    activity_date: f.activity_date.value, category: f.category.value, actual_session: f.actual_session.value.trim(),
    distance_mi: num(f.distance_mi.value), duration_min: num(f.duration_min.value), output_kj: num(f.output_kj.value),
    plan_id: f.plan_id.value || null, notes: f.notes.value.trim() || null,
  };
  $err.textContent = "";

  if (editingId == null) {           // new activities save straight away; History records them
    const btn = $("btn-save");
    btn.disabled = true;
    try { await saveActivity(body); }
    catch (err) { $err.textContent = err.message; }
    finally { btn.disabled = false; }
    return;
  }

  // Edits go through a review step first.
  const changes = diffActivity(editingOrig, body);
  if (!changes.length) { dlg.close(); toast("No changes to save"); return; }
  const linkChanged = changes.some(c => c.field === "plan_id" || c.field === "activity_date");
  const warns = linkChanged ? planLinkWarnings(body.plan_id, body.activity_date) : [];
  showReview({
    title: "Review changes",
    body: html`${diffRows(changes)}${warns.length ? html`<div class="warn-box" style="margin-top:12px"><b>Check the plan link:</b> ${warns.join(" ")}</div>` : ""}`,
    confirmLabel: "Confirm & save",
    action: () => saveActivity(body),
  });
});

form.elements.activity_date.addEventListener("change", () => { refreshPlanSelect(); updatePlanHint(); });
form.elements.plan_id.addEventListener("change", () => {
  // Picking a planned session pre-fills any blank fields from it.
  const p = state.data.plan.find(p => p.plan_id === form.elements.plan_id.value);
  if (!p) return;
  const f = form.elements;
  if (!f.actual_session.value.trim()) f.actual_session.value = p.planned_session;
  if (p.category !== "Rest" && f.category.value !== p.category && !editingId) f.category.value = p.category;
});
form.elements.plan_id.addEventListener("change", updatePlanHint);
document.getElementById("btn-cancel").addEventListener("click", () => dlg.close());
$("btn-delete").addEventListener("click", () => {
  if (editingId == null) return;
  const id = editingId;
  showReview({
    title: "Delete this activity?",
    body: html`<p class="hist-sub" style="margin-bottom:12px">It will be removed from marathon.db. The deletion is recorded in History, but the activity isn't restored automatically.</p>${detailRows(editingOrig)}`,
    confirmLabel: "Delete activity",
    danger: true,
    action: async () => {
      await api(`/api/activities/${id}`, { method: "DELETE" });
      dlg.close();
      toast("Activity deleted");
      await load();
    },
  });
});
$("review-back").addEventListener("click", () => reviewOnly ? dlg.close() : hideReview());
$("review-confirm").addEventListener("click", async () => {
  if (!pendingAction) return;
  const c = $("review-confirm");
  c.disabled = true;
  try { await pendingAction(); }
  catch (err) { $("review-error").textContent = err.message; }
  finally { c.disabled = false; }
});
dlg.addEventListener("close", hideReview);
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

/* ====================================================================
   Delegated events
   ==================================================================== */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const { action, id, week } = t.dataset;
  if (action === "new") openDialog(null);
  else if (action === "edit") openDialog(state.data.activities.find(a => a.activity_id === +id));
  else if (action === "log-plan") {
    const p = state.data.plan.find(p => p.plan_id === id);
    const today = state.data.summary.today;
    openDialog(null, {
      activity_date: p.date <= today ? p.date : today, category: p.category, actual_session: p.planned_session,
      distance_mi: p.target_distance_mi, duration_min: p.target_duration_min, plan_id: p.plan_id,
    });
  }
  else if (action === "toggle-chart-table") { state.chartTable = !state.chartTable; route(); }
  else if (action === "goto-week") location.hash = `#/plan/${week}`;
  else if (action === "reload") load();
  else if (action === "revert") startRevert(+id);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-action]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  const key = e.target.dataset?.filter;
  if (!key) return;
  state.filters[key] = e.target.value;
  if (key === "q") {
    // Re-render but keep the search box focused.
    const pos = e.target.selectionStart;
    route();
    const box = document.querySelector('[data-filter="q"]');
    box.focus(); box.setSelectionRange(pos, pos);
  } else route();
});

load();
</script>
</body>
</html>
